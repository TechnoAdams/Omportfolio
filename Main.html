<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sujan-Sadhu-Portfolio</title>
  <!-- Assuming Bg.css is needed for background or other general styles -->
  <link rel="stylesheet" href="Bg.css">
  <style>
    /* Existing Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #0a0a0a;
      color: #fff;
      /* Increased min-height to ensure scrolling possibility */
      min-height: 250vh;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 100px;
      padding-bottom: 50px; /* Add some padding at the bottom */
    }

    .animated-name {
      font-family: 'Orbitron', sans-serif; /* Assuming you have Orbitron font */
      font-size: 3rem;
      display: flex;
      gap: 0.4rem;
      animation: floatText 3s ease-in-out infinite;
    }

    .animated-name span {
      display: inline-block;
      transition: transform 0.3s ease;
    }

    .animated-name span:hover {
      transform: scale(1.3);
      color: #00f0ff;
      text-shadow: 0 0 5px #00f0ff, 0 0 10px #00f0ff, 0 0 20px #00f0ff;
    }

    .animated-name .last {
      color: #0ff;
      text-shadow: 0 0 5px #0ff, 0 0 10px #0ff, 0 0 20px #0ff, 0 0 40px #0ff;
      animation: glow 2s infinite alternate;
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 5px #0ff, 0 0 10px #0ff, 0 0 20px #0ff;
      }
      to {
        text-shadow: 0 0 10px #0ff, 0 0 20px #0ff, 0 0 30px #0ff, 0 0 50px #0ff;
      }
    }

    @keyframes floatText {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    .image-frame {
      margin-top: 50px;
      border: 4px solid #0ff;
      padding: 10px;
      border-radius: 10px;
      box-shadow: 0 0 20px #0ff;
    }

    .image-frame img {
      max-width: 300px;
      border-radius: 10px;
      display: block; /* Helps prevent extra space below image */
    }

    .who-am-i {
      margin-top: 80px;
      text-align: center;
      padding-bottom: 50px; /* Add some padding at the bottom */
    }

    .who-am-i h2 {
      font-size: 2rem;
      margin-bottom: 20px;
    }

    .who-am-i p {
        max-width: 800px; /* Limit paragraph width for readability */
        margin: 0 auto 30px auto; /* Center paragraph and add margin below */
        line-height: 1.6;
    }

    .who-am-i h3 {
        margin-bottom: 15px;
    }

    .languages {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 20px;
      flex-wrap: wrap; /* Allow icons to wrap on smaller screens */
    }

    .languages img {
      width: 50px;
      height: 50px;
      transition: transform 0.3s ease;
    }

    .languages img:hover {
      transform: scale(1.1);
    }

    /* Removed styles for .more-details-button and modal classes (.details-modal-overlay, .details-modal-content, etc.) */

  </style>
</head>
<body>

  <div class="container">
    <!-- The animated "SUJAN" followed by the glowing "SADHU" -->
    <h1 class="animated-name">
      <span>S</span><span>U</span><span>J</span><span>A</span><span>N</span> <span class="last">SADHU</span>
    </h1>

    <div class="image-frame">
      <img src="HT.jpg" alt="HT Image">
    </div>
  </div>

  <div class="who-am-i">
    <h2>Who am I</h2>
    <p>I am Sujan Sadhu, a Class 9 student. I am passionate about coding and learning new programming languages and tools. My goal is to build software and games that help people and make a positive impact in the world.</p>

    <h3>Languages I Know:</h3>
    <div class="languages">
      <!-- C Logo -->
      <img src="https://upload.wikimedia.org/wikipedia/commons/1/18/C_Programming_Language.svg" alt="C Logo">
      <!-- C# Logo -->
      <img src="https://upload.wikimedia.org/wikipedia/commons/4/4f/Csharp_Logo.png" alt="C# Logo">
      <!-- C++ Logo (Corrected URL) -->
      <img src="https://upload.wikimedia.org/wikipedia/commons/1/18/ISO_C%2B%2B_Logo.svg" alt="C++ Logo">
      <!-- Adobe Premiere Pro Logo -->
      <img src="https://upload.wikimedia.org/wikipedia/commons/f/f2/Adobe_Premiere_Pro_Logo.svg" alt="Adobe Premiere Pro Logo">
      <!-- Adobe After Effects Logo -->
      <img src="https://upload.wikimedia.org/wikipedia/commons/c/cb/Adobe_After_Effects_CC_icon.svg" alt="Adobe After Effects Logo">
      <!-- Blender Logo -->
      <img src="https://upload.wikimedia.org/wikipedia/commons/0/0c/Blender_logo_no_text.svg" alt="Blender Logo">
      <!-- Python Logo -->
      <img src="https://upload.wikimedia.org/wikipedia/commons/c/c3/Python-logo-notext.svg" alt="Python Logo">
      <!-- Java Logo -->
      <img src="https://upload.wikimedia.org/wikipedia/en/3/30/Java_programming_language_logo.svg" alt="Java Logo">
    </div>
  </div>

  <!-- Removed More Details Button and Modal Structure -->
  <!-- Removed the script tag as it's no longer needed -->

</body>
</html>
